apply plugin: 'com.android.application'

def GEO_API_KEY = '"'+GoolgeGeoAPIKey+'"' ?: 'No Api key is detected'
def String_ARRAY = 'String[]'
def BOOLEAN = 'boolean'


android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "com.project.locationscannerapp"
        minSdkVersion 15
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildTypes.each {
        it.buildConfigField 'String', 'GoogleSecAPIKEY', GEO_API_KEY
    }
//        manifestPlaceholders = [ GEO_API_KEY:GEO_API_KEY]

    }

//

    buildTypes {
        debug {
            manifestPlaceholders = [ GEO_API_KEY: '"'+GoolgeGeoAPIKey+'"']
        }

        release {
            manifestPlaceholders = [ GEO_API_KEY:GEO_API_KEY]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-vision:19.0.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
}
